[package]
name = "transmutador_tga"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TGA → PNG (Tier 2 Wave 2 Phase 7.5)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
core_utils = { path = "../core_utils" }
image = { version = "0.25", default-features = false, features = ["tga", "png"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["tga", "png"] }
