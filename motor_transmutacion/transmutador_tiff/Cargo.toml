[package]
name = "transmutador_tiff"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TIFF decode spike for Tier 2 Wave 2 (Phase 7.0)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
core_utils = { path = "../core_utils", features = ["wasm"] }
image = { version = "0.25", default-features = false, features = ["tiff", "png", "jpeg"] }
tiff = { version = "0.11.2", default-features = false, features = ["lzw", "deflate"] }

[dev-dependencies]
tiff = { version = "0.11.2", default-features = false, features = ["lzw", "deflate"] }
