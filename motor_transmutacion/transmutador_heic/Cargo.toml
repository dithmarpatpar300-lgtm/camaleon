[package]
name = "transmutador_heic"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HEIC/HEIF → PNG/JPEG decode (Tier 3 Phase 3.4)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
core_utils = { path = "../core_utils", features = ["wasm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
heic = { version = "0.1.6", default-features = false, features = ["std"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
