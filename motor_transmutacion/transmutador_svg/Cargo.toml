[package]
name = "transmutador_svg"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SVG → PNG/JPEG rasterize (Tier 3 Phase 3.3)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
core_utils = { path = "../core_utils" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.44", default-features = false, features = ["text"] }
usvg = { version = "0.44", default-features = false, features = ["text"] }

[features]
default = []
native-system-fonts = ["usvg/system-fonts"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23"
flate2 = "1.0"
