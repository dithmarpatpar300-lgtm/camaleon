[package]
name = "transmutador_avif_encode"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PNG/JPEG → AVIF encode (Tier 3 Phase 3.2)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
core_utils = { path = "../core_utils" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imgref = "1.12"
ravif = { version = "0.13", default-features = false }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
transmutador_avif = { path = "../transmutador_avif" }
